swagger: "2.0"
info:
  version: "1.0.0"
  title: "E-Commerce API"
  description: "API for managing brands, products, and user cart"
host: "localhost:3000"
schemes:
  - "http"
basePath: "/api"
produces:
  - "application/json"

paths:
  /brands:
    get:
      summary: "Get list of all brands"
      responses:
        200:
          description: "A list of all brands"
          schema:
            type: array
            items:
              $ref: "#/definitions/Brand"
  /brands/{id}/products:
    get:
      summary: "Get list of products for a brand"
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          description: "Brand ID"
      responses:
        200:
          description: "List of products for the specified brand"
          schema:
            type: array
            items:
              $ref: "#/definitions/Product"
  /login:
    post:
      summary: "Login via a username and password"
      parameters:
        - in: body
          name: user
          required: true
          schema:
            type: object
            properties:
              username:
                type: string
              password:
                type: string
            required:
              - username
              - password

      responses:
        200:
          description: "Successfully logged in"
          schema:
            type: object
            properties:
              message:
                type: string
              token:
                type: string
        401:
          description: "Invalid username or password"

  /mycart:
    get:
      summary: "Get list of items in cart"
      responses:
        200:
          description: "A list of the items in the cart"
          schema:
            type: array

  /addToCart:
    post:
      summary: "Add an Item to the Cart"

      parameters:
        - name: Product
          in: body
          required: true
          schema:
            type: object
            required:
              - productId
              - quantity
            properties:
              productId:
                type: integer
              quantity:
                type: integer

      responses:
        200:
          description: "Product successfully added to the cart"
          schema:
            type: array
        404:
          description: "Product not found"

    /cart/productQuantity/{id}:
      put:
        summary: "Updated Cart Quantity"
        parameters:
          - in: path
            name: id
            required: true
            type: integer

          - in: body
            name: body
            required: true
            schema:
              type: object
              properties:
                quantity:
                  type: integer

        responses:
          200:
            description: "Updated Cart Quantity"
          404:
            description: "Product not found in cart"

    /cart/delete/{id}:
      delete:
        summary: "Delete an item from the cart"
        parameters:
          - in: path
            name: id
            required: true
            type: integer

        responses:
          200:
            description: "Deleted item successfully from cart"

          404:
            description: "Product not found in cart"
