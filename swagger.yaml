swagger: "2.0"
info:
  version: "1.0.0"
  title: "E-Commerce API"
  description: "API for managing brands, products, and user cart"
host: "localhost:3000"
schemes:
  - "http"
basePath: "/api"
produces:
  - "application/json"

securityDefinitions:
  BearerAuth:
    type: apiKey
    name: Authorization
    in: header
    description: "Enter the JWT in this format: Bearer <token>"

paths:
  /brands:
    get:
      summary: "Get all brands"
      responses:
        200:
          description: "A list of all brands"
          schema:
            type: array
            items:
              $ref: "#/definitions/Brand"

  /brands/{id}/products:
    get:
      summary: "Get products for a specific brand"
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          description: "Brand ID"
      responses:
        200:
          description: "Products belonging to the specified brand"
          schema:
            type: array
            items:
              $ref: "#/definitions/Product"
        404:
          description: "Brand or products not found"
          schema:
            $ref: "#/definitions/Error"

  /glassesSearch:
    get:
      summary: "Search for glasses by name"
      parameters:
        - name: name
          in: query
          required: true
          type: string
          description: "Exact product name to search for"
      responses:
        200:
          description: "Matching glasses found"
          schema:
            $ref: "#/definitions/Product"
        404:
          description: "Glasses not found"
          schema:
            $ref: "#/definitions/Error"

  /login:
    post:
      summary: "Log in with a username and password"
      parameters:
        - name: user
          in: body
          required: true
          schema:
            $ref: "#/definitions/LoginRequest"
      responses:
        200:
          description: "Successfully logged in"
          schema:
            $ref: "#/definitions/LoginResponse"
        401:
          description: "User not found or password is incorrect"
          schema:
            $ref: "#/definitions/Error"

  /cart:
    get:
      summary: "Get all items in the cart"
      security:
        - BearerAuth: []
      responses:
        200:
          description: "A list of cart items"
          schema:
            type: array
            items:
              $ref: "#/definitions/CartItem"
        401:
          description: "Authentication failed"
          schema:
            $ref: "#/definitions/Error"

  /me/cart:
    post:
      summary: "Add an item to the cart"
      security:
        - BearerAuth: []
      parameters:
        - name: cartItem
          in: body
          required: true
          schema:
            $ref: "#/definitions/CartItem"
      responses:
        200:
          description: "Product successfully added to the cart"
          schema:
            type: array
            items:
              $ref: "#/definitions/CartItem"
        401:
          description: "Authentication failed"
          schema:
            $ref: "#/definitions/Error"
        404:
          description: "Product not found"
          schema:
            $ref: "#/definitions/Error"

  /cart/productQuantity/{id}:
    put:
      summary: "Update the quantity of a cart item"
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          description: "Product ID of the cart item"
        - name: body
          in: body
          required: true
          schema:
            $ref: "#/definitions/QuantityUpdate"
      responses:
        200:
          description: "Cart quantity successfully updated"
          schema:
            type: array
            items:
              $ref: "#/definitions/CartItem"
        401:
          description: "Authentication failed"
          schema:
            $ref: "#/definitions/Error"
        404:
          description: "Product not found in cart"
          schema:
            $ref: "#/definitions/Error"

  /cart/delete/{id}:
    delete:
      summary: "Delete an item from the cart"
      security:
        - BearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          description: "Product ID of the cart item"
      responses:
        200:
          description: "Item successfully deleted from the cart"
          schema:
            type: array
            items:
              $ref: "#/definitions/CartItem"
        401:
          description: "Authentication failed"
          schema:
            $ref: "#/definitions/Error"
        404:
          description: "Product not found in cart"
          schema:
            $ref: "#/definitions/Error"

  /subscribe:
    post:
      summary: "Subscribe an email address"
      parameters:
        - name: subscriber
          in: body
          required: true
          schema:
            $ref: "#/definitions/SubscriptionRequest"
      responses:
        200:
          description: "Email successfully subscribed"
          schema:
            type: array
            items:
              type: string
        400:
          description: "Invalid or missing email address"
          schema:
            $ref: "#/definitions/Error"

  /articles:
    get:
      summary: "Get all articles"
      responses:
        200:
          description: "A list of all articles"
          schema:
            type: array
            items:
              $ref: "#/definitions/Article"
        404:
          description: "Articles not found"
          schema:
            $ref: "#/definitions/Error"

  /articles/{id}:
    get:
      summary: "Get an article by ID"
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          description: "Article ID"
      responses:
        200:
          description: "Article successfully found"
          schema:
            $ref: "#/definitions/Article"
        404:
          description: "Article not found"
          schema:
            $ref: "#/definitions/Error"

definitions:
  Brand:
    type: object
    properties:
      id:
        type: integer
      name:
        type: string

  Product:
    type: object
    properties:
      id:
        type: integer
      brandId:
        type: integer
      name:
        type: string
      price:
        type: number
        format: float

  CartItem:
    type: object
    required:
      - productId
      - quantity
    properties:
      productId:
        type: integer
      quantity:
        type: integer
        minimum: 1

  QuantityUpdate:
    type: object
    required:
      - quantity
    properties:
      quantity:
        type: integer
        minimum: 1

  LoginRequest:
    type: object
    required:
      - username
      - password
    properties:
      username:
        type: string
      password:
        type: string
        format: password

  LoginResponse:
    type: object
    properties:
      message:
        type: string
        example: "Auth successful"
      token:
        type: string

  SubscriptionRequest:
    type: object
    required:
      - email
    properties:
      email:
        type: string
        format: email

  Article:
    type: object
    properties:
      id:
        type: integer
      title:
        type: string
      content:
        type: string

  Error:
    type: object
    properties:
      message:
        type: string
