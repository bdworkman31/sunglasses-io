swagger: "2.0"
info:
  version: "1.0.0"
  title: "E-Commerce API"
  description: "API for managing brands, products, and user cart"
host: "localhost:3000"
schemes:
  - "http"
basePath: "/api"
produces:
  - "application/json"

paths:
  /brands:
    get:
      summary: "Get list of all brands"
      responses:
        200:
          description: "A list of all brands"
          schema:
            type: array
            items:
              $ref: "#/definitions/Brand"
  /brands/{id}/products:
    get:
      summary: "Get list of products for a brand"
      parameters:
        - name: id
          in: path
          required: true
          type: integer
          description: "Brand ID"
      responses:
        200:
          description: "List of products for the specified brand"
          schema:
            type: array
            items:
              $ref: "#/definitions/Product"
  /mycart:
    get:
      summary: "Get list items in cart"
      responses:
        200:
          description: "A list of the items in the cart"
          schema:
            type: array

  /addToCart:
    post:
      summary: "Add an Item to the Cart"

      parameters:
        - name: Product
          in: body
          required: true
          schema:
            type: object
            required:
              - productId
              - quantity
            properties:
              productId:
                type: integer
              quantity:
                type: integer

      responses:
        200:
          description: "Product successfully added to the cart"
          schema:
            type: array
        404:
          description: "Product not found"
